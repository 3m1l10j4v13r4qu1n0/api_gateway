name: api-gateway-ecosystem

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth_service:
    build:
      context: ./auth_service
    container_name: auth_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db
      DEBUG: ${DEBUG:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-mi_secreto_super_secreto_cambiar_en_produccion}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 60
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,urllib.error; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  afiliados_service:
    build:
      context: ./afiliados_service
    container_name: afiliados_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/afiliados_db
      DEBUG: ${DEBUG:-false}
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
      GOOGLE_CREDENTIALS_PATH: ${GOOGLE_CREDENTIALS_PATH:-}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,urllib.error; urllib.request.urlopen('http://localhost:8002/')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  api_gateway:
    build:
      context: ..
      dockerfile: docker/gateway/Dockerfile
    container_name: api_gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth_service:8001
      AFILIADOS_SERVICE_URL: http://afiliados_service:8002
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
    ports:
      - "8000:8000"
    depends_on:
      auth_service:
        condition: service_healthy
      afiliados_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,urllib.error; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: